services:
  db:
    image: mysql:8.0
    container_name: carewatch_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-carewatch_secret}
      MYSQL_DATABASE: ${DB_NAME:-carewatch_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: carewatch_backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-carewatch_secret}
      DB_NAME: ${DB_NAME:-carewatch_db}
      SECRET_KEY: ${SECRET_KEY:-carewatch-prod-key}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-carewatch-jwt-key}
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: carewatch_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
